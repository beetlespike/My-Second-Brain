<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="640" viewBox="0 0 720 457" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">From you to your knowledge base, then back to you</title>
  <desc id="desc">You watch videos, read articles or papers, and take part in conversations. After studying a source you give its link to Codex. The concepts from that material connect in your private knowledge base. Codex follows those connections, looks for a missing concept and makes a study card. You learn the new concept from the card and bring it into your next reading. Your learning over time also shapes the taste and judgment you bring to working with AI.</desc>
  <defs>
    <linearGradient id="ground" x2=".9" y2="1">
      <stop stop-color="#151a21"/><stop offset=".7" stop-color="#101419"/><stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#302b23"/><stop offset="1" stop-color="#211e1a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#b2c0cf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gold-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#dec592" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="455" rx="18" fill="url(#ground)" stroke="#353d47"/>
  <g font-family="'Segoe UI',Arial,sans-serif" fill="#cbd4df">
    <g id="learning-cycle">
      <text x="31" y="39" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#f0f0ec">Your learning loop with your knowledge base</text>
      <path d="M496 32H687" stroke="#36404c"/>

      <g id="person" text-anchor="middle">
        <text x="153" y="77" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#f2f1ec">You learn from<tspan x="153" dy="28">many sources</tspan></text>
        <text x="153" y="139" font-size="16.6">Videos · Articles · Papers · Chats</text>
      </g>
      <g id="person-to-vault" data-from="person" data-to="vault">
        <text x="360" y="66" text-anchor="middle" font-size="16.3">After studying,<tspan x="360" dy="20">paste the source link</tspan></text>
        <path d="M267 101h181" fill="none" stroke="#9eafc1" stroke-width="2.2" marker-end="url(#arrow)"/>
      </g>
      <g id="vault" text-anchor="middle">
        <path d="M474 144h198q9 0 9-8" fill="none" stroke="#546474"/>
        <rect x="458" y="65" width="231" height="75" rx="10" fill="#1b222b" stroke="#65778b" stroke-width="1.4"/>
        <text x="573.5" y="96" font-family="Georgia,'Times New Roman',serif" font-size="23" fill="#f0f0ec">Your knowledge base</text>
        <text x="573.5" y="127" font-size="15">Codex extracts &amp; links concepts</text>
      </g>
      <g id="vault-to-discovery" data-from="vault" data-to="discovery">
        <path d="M574 154v66" fill="none" stroke="#94a4b6" stroke-width="2.2" marker-end="url(#arrow)"/>
        <text x="556" y="191" text-anchor="end" font-size="17">Follow existing links</text>
      </g>
      <g id="discovery" text-anchor="middle">
        <text x="574" y="253" font-family="Georgia,serif" font-size="32" fill="#f2f1ec">Codex</text>
        <text x="574" y="287" font-size="17.7">Looks for a missing concept</text>
        <text x="574" y="317" font-size="16.2">Explains its links to existing nodes</text>
      </g>
      <g id="discovery-to-card" data-from="discovery" data-to="card">
        <text x="365" y="257" text-anchor="middle" font-size="17.5">Make a card</text>
        <path d="M449 272H283" fill="none" stroke="#bda677" stroke-width="2.2" marker-end="url(#gold-arrow)"/>
      </g>
      <g id="card" text-anchor="middle">
        <path d="M45 224h211q8 0 9 8" fill="none" stroke="#78684e"/>
        <rect x="32" y="229" width="242" height="86" rx="10" fill="url(#paper)" stroke="#a28c64" stroke-width="1.4"/>
        <text x="153" y="250" font-size="16" fill="#dcca9e">Study card for a new concept</text>
        <text x="153" y="277" font-size="21.5" font-weight="600" fill="#f3dca8">Prefill–decode<tspan x="153" dy="24">disaggregation</tspan></text>
      </g>
      <g id="card-to-person" data-from="card" data-to="person">
        <path d="M153 216v-61" fill="none" stroke="#bda677" stroke-width="2.2" marker-end="url(#gold-arrow)"/>
        <text x="170" y="178" font-size="18">Learn a new concept</text>
        <text x="170" y="206" font-size="15.5" fill="#adb9c7">Use it to read the next source</text>
      </g>
    </g>
    <g id="wider-collaboration">
      <path d="M31 340h658" fill="none" stroke="#49535e"/>
      <text x="32" y="374" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#f0f0ec">Working with AI</text>
      <text x="688" y="376" text-anchor="end" font-family="Georgia,serif" font-style="italic" font-size="19" fill="#b3becb">Human in the loop</text>
      <text x="33" y="408" font-size="18.2">With each round, you learn more and develop your own taste and judgment.</text>
      <text x="33" y="438" font-size="18.2">You bring that perspective to research, creative work and decisions with AI.</text>
    </g>
  </g>
</svg>
