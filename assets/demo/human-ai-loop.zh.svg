<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="640" viewBox="0 0 720 457" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">先从人到知识库，再从知识库回到人</title>
  <desc id="desc">你先看视频、读文章或论文、参与对话。学过后把来源链接交给 Codex，材料里的概念在你的私人知识库中相连。Codex 从这些联系里寻找缺失的概念，做成待学卡。你从卡片学到新概念，再带着新的理解去学下一份材料。个人的长期学习，也塑造与 AI 共事时的品味和判断。</desc>
  <defs>
    <linearGradient id="ground" x2=".9" y2="1">
      <stop stop-color="#151a21"/><stop offset=".7" stop-color="#101419"/><stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#302b23"/><stop offset="1" stop-color="#211e1a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#b2c0cf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gold-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#dec592" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="455" rx="18" fill="url(#ground)" stroke="#353d47"/>
  <g font-family="'PingFang SC','Segoe UI','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" fill="#cbd4df">
    <g id="learning-cycle">
      <text x="31" y="39" font-family="'Songti SC','Noto Serif CJK SC',SimSun,Georgia,serif" font-size="24" fill="#f0f0ec">你与知识库的学习循环</text>
      <path d="M292 32H687" stroke="#36404c"/>

      <g id="person" text-anchor="middle">
        <text x="153" y="101" font-family="'Songti SC','Noto Serif CJK SC',SimSun,Georgia,serif" font-size="32" fill="#f2f1ec">你从各处学习</text>
        <text x="153" y="139" font-size="19">视频 · 文章 · 论文 · 对话</text>
      </g>
      <g id="person-to-vault" data-from="person" data-to="vault">
        <text x="360" y="86" text-anchor="middle" font-size="17.5">学过后贴来源链接</text>
        <path d="M267 101h181" fill="none" stroke="#9eafc1" stroke-width="2.2" marker-end="url(#arrow)"/>
      </g>
      <g id="vault" text-anchor="middle">
        <path d="M474 144h198q9 0 9-8" fill="none" stroke="#546474"/>
        <rect x="458" y="65" width="231" height="75" rx="10" fill="#1b222b" stroke="#65778b" stroke-width="1.4"/>
        <text x="573.5" y="96" font-family="'Songti SC','Noto Serif CJK SC',SimSun,Georgia,serif" font-size="26" fill="#f0f0ec">你的知识库</text>
        <text x="573.5" y="127" font-size="17">Codex 提炼并连接概念</text>
      </g>
      <g id="vault-to-discovery" data-from="vault" data-to="discovery">
        <path d="M574 154v66" fill="none" stroke="#94a4b6" stroke-width="2.2" marker-end="url(#arrow)"/>
        <text x="556" y="191" text-anchor="end" font-size="17">沿着已有联系</text>
      </g>
      <g id="discovery" text-anchor="middle">
        <text x="574" y="253" font-family="Georgia,serif" font-size="32" fill="#f2f1ec">Codex</text>
        <text x="574" y="287" font-size="18">寻找尚未收录的概念</text>
        <text x="574" y="317" font-size="18">说明它与哪些旧节点相连</text>
      </g>
      <g id="discovery-to-card" data-from="discovery" data-to="card">
        <text x="365" y="257" text-anchor="middle" font-size="17.5">做成卡片</text>
        <path d="M449 272H283" fill="none" stroke="#bda677" stroke-width="2.2" marker-end="url(#gold-arrow)"/>
      </g>
      <g id="card" text-anchor="middle">
        <path d="M45 224h211q8 0 9 8" fill="none" stroke="#78684e"/>
        <rect x="32" y="229" width="242" height="86" rx="10" fill="url(#paper)" stroke="#a28c64" stroke-width="1.4"/>
        <text x="153" y="256" font-size="17" fill="#dcca9e">待学概念卡</text>
        <text x="153" y="291" font-size="23" font-weight="600" fill="#f3dca8">预填充与解码分离</text>
      </g>
      <g id="card-to-person" data-from="card" data-to="person">
        <path d="M153 216v-61" fill="none" stroke="#bda677" stroke-width="2.2" marker-end="url(#gold-arrow)"/>
        <text x="170" y="178" font-size="18">学到新概念</text>
        <text x="170" y="206" font-size="16.5" fill="#adb9c7">带着它读下一份材料</text>
      </g>
    </g>
    <g id="wider-collaboration">
      <path d="M31 340h658" fill="none" stroke="#49535e"/>
      <text x="32" y="374" font-family="'Songti SC','Noto Serif CJK SC',SimSun,Georgia,serif" font-size="26" fill="#f0f0ec">与 AI 共事</text>
      <text x="688" y="376" text-anchor="end" font-family="Georgia,serif" font-style="italic" font-size="19" fill="#b3becb">Human in the loop</text>
      <text x="33" y="408" font-size="20">你在一次次学习中拓宽所知，养成自己的品味与判断。</text>
      <text x="33" y="438" font-size="20">带着这份眼光，与 AI 一起研究、创作、做决定。</text>
    </g>
  </g>
</svg>
